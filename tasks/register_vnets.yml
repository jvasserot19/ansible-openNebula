---
- name: Query existing OpenNebula virtual networks
  ansible.builtin.shell: |
    su - oneadmin -c "onevnet list --csv"
  register: existing_vnets
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['one_frontends'][0] }}"

- name: Parse existing VNet names
  ansible.builtin.set_fact:
    existing_vnet_names: "{{ existing_vnets.stdout_lines | map('split', ',') | map('first') | list }}"
  run_once: true

- name: Generate virtual network template files on Frontend
  ansible.builtin.template:
    src: templates/vnet.net.j2
    dest: "/var/tmp/vnet-{{ item.name }}.net"
    owner: oneadmin
    group: oneadmin
    mode: '0644'
  loop: "{{ opennebula_vnets }}"
  when: item.name not in existing_vnet_names
  run_once: true
  delegate_to: "{{ groups['one_frontends'][0] }}"

- name: Register virtual networks into OpenNebula
  ansible.builtin.shell: |
    su - oneadmin -c "onevnet create /var/tmp/vnet-{{ item.name }}.net"
  loop: "{{ opennebula_vnets }}"
  when: item.name not in existing_vnet_names
  register: vnet_creation_result
  run_once: true
  delegate_to: "{{ groups['one_frontends'][0] }}"

- name: Remove temporary VNet template files
  ansible.builtin.file:
    path: "/var/tmp/vnet-{{ item.name }}.net"
    state: absent
  loop: "{{ opennebula_vnets }}"
  when: item.name not in existing_vnet_names
  run_once: true
  delegate_to: "{{ groups['one_frontends'][0] }}"

- name: Verify registered virtual networks
  ansible.builtin.shell: |
    su - oneadmin -c "onevnet show '{{ item.name }}' | grep -E '^BRIDGE\s+:'"
  loop: "{{ opennebula_vnets }}"
  register: vnet_verify
  failed_when: vnet_verify.rc != 0
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['one_frontends'][0] }}"
