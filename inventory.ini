# Physical bare-metal hosts
[baremetal_hosts]
kvm01.internal.lan ansible_host=10.4.16.52
kvm02.internal.lan ansible_host=10.4.16.53

# Keep existing_nodes pointed to baremetal_hosts for backwards compatibility
[existing_nodes:children]
baremetal_hosts

# 3 HA Frontend VMs
[one_frontends]
fe01.internal.lan ansible_host=10.4.16.11 server_id=0 keepalived_priority=101
fe02.internal.lan ansible_host=10.4.16.12 server_id=1 keepalived_priority=100
fe03.internal.lan ansible_host=10.4.16.13 server_id=2 keepalived_priority=99

# Group for onboarding new hypervisors
[new_nodes]

[all_nodes:children]
baremetal_hosts
new_nodes

[all:vars]
ansible_user=root
one_cluster_name=default
one_ha_vip=10.4.16.10
db_host=10.4.16.20
db_user=oneadmin
db_password=SecretClusterPass123
